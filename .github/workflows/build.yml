name: Build and release Daymark
on:
  push:
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: daymark-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
            arch: x64
          - os: macos-latest
            platform: mac
            arch: arm64
          - os: macos-latest
            platform: mac
            arch: x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run test:desktop
      - run: node scripts/workspaces-test.cjs
      - run: node scripts/workspace-transfer-test.cjs
      - run: npx electron-builder --${{ matrix.platform }} --${{ matrix.arch }} --publish never
      - if: matrix.platform == 'win'
        run: node scripts/test-windows-update.mjs
      - if: matrix.platform == 'mac'
        run: node scripts/test-mac-update.mjs ${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: Daymark-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            release/Daymark-*-Windows-*.exe
            release/Daymark-*-Mac-*.zip
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Verify tag and complete platform set
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/verify-release.mjs release-assets
      - name: Publish all platforms together
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" release-assets/* --title "Daymark $RELEASE_TAG" --notes-file RELEASE-NOTES.md --verify-tag
